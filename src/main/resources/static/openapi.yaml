openapi: 3.0.3
info:
  title: LedgerCore API
  version: 1.0.0
  description: Demo banking API. No authentication; not suitable for real money.
servers:
  - url: http://localhost:8080
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Application is running
  /api/accounts:
    post:
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccount'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      summary: Retrieve an account
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: Account not found
  /api/accounts/{id}/transactions:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      summary: List transactions involving an account, newest first
      responses:
        '200':
          description: Transaction history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/accounts/{id}/deposits:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      summary: Deposit money
      requestBody:
        $ref: '#/components/requestBodies/Amount'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/accounts/{id}/withdrawals:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      summary: Withdraw money
      requestBody:
        $ref: '#/components/requestBodies/Amount'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Insufficient funds
  /api/accounts/transfers:
    post:
      summary: Transfer money between accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transfer'
      responses:
        '204':
          description: Transfer completed
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Insufficient funds
components:
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  requestBodies:
    Amount:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [amount]
            properties:
              amount:
                type: number
                minimum: 0.01
                multipleOf: 0.01
                example: 25.00
  schemas:
    CreateAccount:
      type: object
      required: [ownerName]
      properties:
        ownerName:
          type: string
          minLength: 1
          example: Alex
    Account:
      type: object
      properties:
        id:
          type: integer
          format: int64
        ownerName:
          type: string
        balance:
          type: number
          example: 100.00
    Transfer:
      type: object
      required: [fromAccountId, toAccountId, amount]
      properties:
        fromAccountId:
          type: integer
          format: int64
        toAccountId:
          type: integer
          format: int64
        amount:
          type: number
          minimum: 0.01
          multipleOf: 0.01
    Transaction:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [DEPOSIT, WITHDRAWAL, TRANSFER]
        fromAccountId:
          type: integer
          format: int64
          nullable: true
        toAccountId:
          type: integer
          format: int64
          nullable: true
        amount:
          type: number
        createdAt:
          type: string
          format: date-time
    ApiError:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Account not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
